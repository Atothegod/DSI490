services:
  agent:
    build:
      context: ./dspy-agent
      dockerfile: dockerfile
    env_file:
      - ./dspy-agent/.env
    environment:
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini/gemini-3.1-flash-lite}
      DATABASE_URL: postgresql://agent:agentpass@db:5432/agentdb
    ports:
      - "127.0.0.1:8010:8000"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agentpass
      POSTGRES_DB: agentdb
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agentdb"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
