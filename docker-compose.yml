services:
  agent:
    build:
      context: ./dspy-agent
      dockerfile: dockerfile
    env_file:
      - ./dspy-agent/.env
    environment:
      GEMINI_MODEL: gemini/gemini-2.5-flash
      DATABASE_URL: postgresql://agent:agentpass@db:5432/agentdb
    ports:
      - "8010:8000"
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agentpass
      POSTGRES_DB: agentdb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
